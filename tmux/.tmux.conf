###############################################################
######################### TMUX CONFIG #########################
###############################################################
set -g base-index 1                                             # Set the base index from which an unused index should
                                                                # be searched when a new window is created. The default 
                                                                # is zero. 

set -g default-terminal "tmux-256color"                         # Set the default terminal for new windows created in
set -g terminal-overrides ',xterm-256color:Tc'                  # this session - the default value of the TERM environment
set -as terminal-overrides ',xterm*:sitm=\E[3m'                 # variable. For tmux to work correctly, this must be set
                                                                # to ‘screen’, ‘tmux’ or a derivative of them.
if-shell '! infocmp tmux-256color > /dev/null 2>&1' \
    'set -g default-terminal "screen-256color"'                 # Fall back where tmux-256color isn't installed

set-option -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on                                          # Pass focus in/out to programs (vim autoread)
set -s extended-keys on                                         # Pass Shift+Enter, Ctrl+Shift+key, etc. to programs
set -sq extended-keys-format csi-u                              # that ask for them, as CSI u (tmux 3.5+)
set -g set-titles on                                            # Show the session and window in the terminal's title
set -g set-titles-string '#S: #W'

# Features of terminals tmux can't detect from their terminfo: truecolor, OSC 52 clipboard,
# undercurl and colored underlines, OSC 8 links, extended keys and synchronized output.
# -q skips these on tmux older than 3.2.
set -asq terminal-features ',xterm-ghostty:RGB:clipboard:usstyle:extkeys:sync:hyperlinks'
# tmux inside tmux, e.g. on a host you ssh to from a tmux pane, sees TERM=tmux-256color and
# otherwise keeps copies to itself. The outer tmux forwards them on (set-clipboard on).
set -asq terminal-features ',tmux*:clipboard,screen*:clipboard'
# Update terminal-specific variables when a client attaches, so new panes match the terminal
# that's attached rather than the one the server started in
set -ga update-environment ' GHOSTTY_RESOURCES_DIR GHOSTTY_BIN_DIR GHOSTTY_SHELL_FEATURES'

# Mouse copy: releasing a drag (or a double/triple click in copy mode) copies the selection to
# the tmux buffer and, through set-clipboard, the terminal's clipboard (OSC 52, also over ssh).
# The selection stays highlighted so you keep your place in the scrollback; click to clear it,
# q to leave copy mode. Middle-click pastes the last copy (tmux default).
bind-key -T copy-mode-vi MouseDown1Pane    select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear

# Mouse scrolling configuration
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M
bind-key -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind-key -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind-key -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind-key -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind-key -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

###############################################################
####################### THEME SETTINGS ########################
###############################################################

#+--------+
#+ Status +
#+--------+
#+--- Colors ---+
set -g status-bg black                                          # Set the background color of the status bar.

set -g status-fg white                                          # Set the forground color of the status bar.

#+--- Size ---+
set -g status-left-length 30                                    # Set the maximum length of the left component
                                                                # of the status bar. The default is 10.

set -g status-right-length 60                                   # Set the maximum length of the right component
                                                                # of the status bar. The default is 40.

#+--- Bars ---+
set -g status-left "#[fg=white,bg=brightblack] #S #[fg=brightblack,bg=black]"
set -g status-right '#[fg=brightblack,bg=black]#[fg=white,bg=brightblack] %I:%M%P #[fg=black,bg=brightblack]#[fg=brightblack,bg=black]#[fg=white,bg=brightblack] %h. %d #[fg=black,bg=brightblack]#[fg=brightblack,bg=black]#[fg=white,bg=brightblack] #H '

#+--- Windows ---+
setw -g window-status-format '#[bg=brightblack,fg=black] #[bg=brightblack,fg=white]#I #W  #[bg=black,fg=brightblack]'
setw -g window-status-current-format '#[bg=white,fg=black] #I #W  #[bg=black,fg=white]'
set -g window-status-separator ""


###############################################################
######################## KEY BINDINGS #########################
###############################################################
unbind C-b                                  # Set the prefix to ^A.
set -g prefix ^A
bind a send-prefix

unbind R                                    # Set R to reload tmux config.               
bind R source-file ~/.tmux.conf            

unbind ^A                                   # Set a to go to the last window.
bind ^A last-window

set-window-option -g mode-keys vi           # Act like Vim; use h,j,k,l to select panes and move the cursor
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send-keys -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental \"%%%\""

bind-key -T prefix       |                    split-window -h     # side by side
bind-key -T prefix       -                    split-window -v     # top and bottom

bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history

###############################################################
####################### DEFAULT BINDINGS ######################
###############################################################
# General
#
#    ? = List all key bindings.
#    d = Detach the current client.
#    : = Enter the tmux command prompt.
#
# Creating/Managing windows
#
#    c = Create a new window
#    n = Change to the next window.
#    p = Change to the previous window.
#    l = Move to the previously selected window.
#    0-9 = Select windows 0 to 9.
#    ' = Prompt for a window index to select. Then enter a number or title to switch to that window.
#    , = Rename the current window.
#    w = Choose the current window interactively.
#    :, then type list-windows enter = Display the list of windows.
#
# Creating/Managing panes
#
#    " = Split the current pane into two, top and bottom.
#    % = Split the current pane into two, left and right.
#    o = Select the next pane in the current window.
#    ; = Move to the previously active pane.
#    { = Swap the current pane with the previous pane.
#    } = Swap the current pane with the next pane.
#    Ctrl+o = Rotate the panes in the current window forwards.
#    Alt+1 to Alt+5 = Arrange panes in one of the five preset layouts: even-horizontal, even-vertical,
#                                                                      main-horizontal, main-vertical,
#                                                                      or tiled.
#    x = Kill the current pane.
#    ! = Break the current pane out of the window.
#
# Copy, Paste and Scroll operations
#    The keys available depend on whether emacs (default) or vi mode is selected. 
#    The mode-keys option can be set int .tmux.conf for vi mode.
#    [ = Enter copy mode to copy text or view the history.
#    ] = Paste the most recently copied buffer of text.
#    # = List all paste buffers.
#    - = Delete the most recently copied buffer of text (rebound above to split top and bottom).
